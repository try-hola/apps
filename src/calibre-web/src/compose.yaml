# Calibre-Web — web front-end for a Calibre ebook library. Packaged for Hola:
# Traefik-only ingress (no host ports), all persistence bind-mounted under
# ${HOLA_APP_DATA}.
#
# Reader connectivity is the reason this package exists in the shape it does.
# E-reader apps (OPDS) and Kobo devices can't follow an SSO redirect, so the
# manifest exempts /opds and /kobo/ from Hola's Authentik forward-auth gate.
# Those paths are NOT left open: Calibre-Web authenticates them itself — HTTP
# Basic for OPDS, and a per-user secret sync token embedded in the URL path for
# Kobo. See README.md for the verification of that.
services:
  # First-run seeder. Calibre-Web can only *read* an existing Calibre library —
  # it never creates one (cps/db.py's check_valid_db and setup_db both bail out
  # when metadata.db is absent), so on a fresh Hola install the app would come
  # up permanently stuck on its /admin/dbconfig setup page with nothing the
  # user could point it at. This sidecar puts an empty Calibre library in place
  # and pre-answers the first-run config, so the app boots straight to a login.
  #
  # Runs the app's own image (already pulled — no second image to fetch) with
  # the s6 entrypoint overridden, so it seeds and exits instead of starting a
  # server. Everything it does is guarded: an existing library is never touched.
  calibre-web-init:
    image: lscr.io/linuxserver/calibre-web:0.6.26-ls393@sha256:7c0464228f2fdcf543b46e5327f36114596b097db6af0297c26b0452ed15f17c
    entrypoint: ["/bin/bash", "-c"]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
    command:
      - |
        set -e
        mkdir -p /books /config /custom-cont-init.d

        if [ ! -f /books/metadata.db ]; then
          echo "[hola] no Calibre library at /books — seeding an empty one"
          # An empty Calibre library (metadata.db), gzipped and base64'd. Taken
          # verbatim from upstream's own template at janeczku/calibre-web
          # library/metadata.db, VACUUMed to shrink it. It's embedded rather
          # than downloaded so a fresh install needs no network beyond the
          # image pull. To regenerate:
          #   curl -sLO https://raw.githubusercontent.com/janeczku/calibre-web/master/library/metadata.db
          #   sqlite3 metadata.db 'VACUUM;' && gzip -9 -c metadata.db | base64 -w0
          echo '' | base64 -d | gunzip > /books/metadata.db
          # Give this library its own identity. The upstream template ships a
          # fixed library UUID; Calibre-Web keys database-change detection (and
          # Kobo sync state) off it, so every install gets a fresh one.
          python3 -c "
        import sqlite3, uuid
        c = sqlite3.connect('/books/metadata.db')
        c.execute('update library_id set uuid = ?', (str(uuid.uuid4()),))
        c.commit()
        "
          echo "[hola] seeded an empty Calibre library"
        else
          echo "[hola] existing Calibre library found at /books — leaving it alone"
        fi

        # Pre-answer Calibre-Web's first-run setup. Its settings live in
        # /config/app.db, which doesn't exist until the app container's own s6
        # init creates it — so this can't be done from here. Instead drop a
        # script in LinuxServer's custom-init hook: s6 runs it after
        # init-calibre-web-config (which creates app.db) and before the app
        # starts. It's idempotent — it only writes when the library path is
        # still unset, so anything changed later in the UI is never clobbered.
        cat > /custom-cont-init.d/10-hola-first-run <<'INIT'
        #!/usr/bin/with-contenv bash
        python3 -c "
        import sqlite3, os

        db = '/config/app.db'
        if not os.path.exists(db):
            raise SystemExit(0)

        c = sqlite3.connect(db)
        row = c.execute('select config_calibre_dir from settings').fetchone()
        if row and row[0]:
            raise SystemExit(0)

        c.execute(
            'update settings set config_calibre_dir = ?, config_kobo_sync = 1,'
            ' config_external_port = 443, config_kobo_proxy = 0',
            ('/books',),
        )
        c.commit()
        print('[hola] first-run defaults written to app.db')
        "
        INIT
        chmod +x /custom-cont-init.d/10-hola-first-run

        chown -R "${PUID:-1000}:${PGID:-1000}" /books /config /custom-cont-init.d
    volumes:
      - ${HOLA_APP_DATA}/config:/config
      - ${HOLA_APP_DATA}/books:/books
      - ${HOLA_APP_DATA}/custom-cont-init.d:/custom-cont-init.d

  calibre-web:
    image: lscr.io/linuxserver/calibre-web:0.6.26-ls393@sha256:7c0464228f2fdcf543b46e5327f36114596b097db6af0297c26b0452ed15f17c
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      # Optional (x86-64 only): installs Calibre's command-line tools at
      # container start so Calibre-Web can convert between ebook formats on
      # download. Empty = skip. EPUB→KEPUB conversion for Kobo does NOT need
      # this — kepubify ships in the image and LinuxServer's init points
      # Calibre-Web at it automatically.
      DOCKER_MODS: ${DOCKER_MODS}
    volumes:
      # Calibre-Web's own state: app.db (users, settings, Kobo sync tokens).
      - ${HOLA_APP_DATA}/config:/config
      # The Calibre library itself — metadata.db plus the book files.
      - ${HOLA_APP_DATA}/books:/books
      # LinuxServer's custom-init hook, populated by calibre-web-init above.
      - ${HOLA_APP_DATA}/custom-cont-init.d:/custom-cont-init.d
    # Web UI on 8083. Hola routes ingress through Traefik to this container port
    # (manifest.ingress.port) — no host ports.
    expose:
      - "8083"
    depends_on:
      # Don't start until the library exists and the first-run hook is in place.
      calibre-web-init:
        condition: service_completed_successfully
