services:
  proxmox-mcp:
    # ProxmoxMCP-Plus (MIT) — https://github.com/RekklesNA/ProxmoxMCP-Plus
    # Multi-arch (linux/amd64, linux/arm64); runs as the unprivileged `proxmoxmcp` user.
    #
    # PRE-RELEASE (channel `beta`): built from the pofallon/ProxmoxMCP-Plus fork at
    # v0.5.15-hola.1 = upstream v0.5.15 + the VM provisioning tools proposed in
    # RekklesNA/ProxmoxMCP-Plus#127 (update_vm_config, get_vm_ip_addresses,
    # get_next_vmid). Switch back to the upstream image once a release includes them.
    image: ghcr.io/pofallon/proxmoxmcp-plus:v0.5.15-hola.1@sha256:d36d2fdba3e7dd5f503ef869f85197f9fea97e442b0c5ed17d7826c5623a7aff
    environment:
      # Native MCP Streamable HTTP mode (the image defaults to its OpenAPI/REST
      # bridge on 8811, which Hola does not expose). The MCP endpoint is /mcp.
      PROXMOX_MCP_MODE: mcp-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      MCP_TRANSPORT: STREAMABLE_HTTP
      # Proxmox VE connection — all from the install wizard (manifest defaultEnv).
      # The image's PROXMOX_MCP_CONFIG points at a config file that is never
      # mounted here, so the loader falls back to these variables.
      PROXMOX_HOST: "${PROXMOX_HOST}"
      PROXMOX_PORT: "${PROXMOX_PORT}"
      PROXMOX_USER: "${PROXMOX_USER}"
      PROXMOX_TOKEN_NAME: "${PROXMOX_TOKEN_NAME}"
      PROXMOX_TOKEN_VALUE: "${PROXMOX_TOKEN_VALUE}"
      PROXMOX_VERIFY_SSL: "${PROXMOX_VERIFY_SSL}"
      # Upstream blocks verify_ssl=false unless dev_mode is on; the wizard exposes
      # both so an operator with a self-signed Proxmox cert can flip them together.
      PROXMOX_DEV_MODE: "${PROXMOX_DEV_MODE}"
      # Inbound bearer credential every MCP client must present. Generated by
      # Hola at install (manifest defaultEnv). /mcp is exempted from Authentik's
      # forward-auth precisely because this key protects it.
      MCP_API_KEY: "${MCP_API_KEY}"
      # Tools hidden from every client (comma-separated). Defaults to the
      # destructive ones; clear it in the wizard to expose everything.
      MCP_TOOL_DENYLIST: "${MCP_TOOL_DENYLIST}"
      # Guest-agent command execution policy (deny_all | allowlist | audit_only)
      # and the allowlist patterns; both from the wizard's advanced fields.
      COMMAND_POLICY_MODE: "${COMMAND_POLICY_MODE}"
      COMMAND_POLICY_ALLOW_PATTERNS: "${COMMAND_POLICY_ALLOW_PATTERNS}"
      # DNS-rebinding protection: only the public host Traefik serves, plus
      # loopback for the container healthcheck below. Each host is listed both
      # bare and with `:*` — the MCP SDK matches a `host:*` pattern only when
      # the Host header carries a port, and Traefik forwards the bare host
      # (verified: bare-host-only allowlists answer 421 behind a proxy).
      MCP_DNS_REBINDING_PROTECTION: "true"
      MCP_ALLOWED_HOSTS: "${HOLA_APP_HOST},${HOLA_APP_HOST}:*,127.0.0.1,127.0.0.1:*,localhost,localhost:*"
      # Browser origin, for a UI client; non-browser MCP clients send no Origin
      # header and pass regardless.
      MCP_ALLOWED_ORIGINS: "https://${HOLA_APP_HOST}"
    healthcheck:
      # The MCP transport has no unauthenticated health route; any HTTP answer
      # on /mcp (a 401 without the bearer key) proves the server is up, so this
      # deliberately does NOT use `curl -f`.
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://127.0.0.1:8000/mcp"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
