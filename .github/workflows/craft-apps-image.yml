name: Craft Apps image

# Builds ghcr.io/<owner>/craft-apps-web: the upstream web builds of the storytold
# "Craft" apps (pinned in images/craft-apps/apps.lock.json) plus a landing page,
# served by unprivileged nginx. The src/craft-apps bundle runs that image.
#
# push (any branch touching images/craft-apps/): build, smoke-test every app in
#   headless Chromium, push. The tag is a hash of images/craft-apps/, so the
#   same inputs always give the same tag and an existing tag is never re-pushed.
#   The job summary prints the image@digest to pin in src/craft-apps.
#
# schedule / workflow_dispatch: first move the pins to each app's latest
#   release (scripts/update.mjs). A release that fails the smoke test is put
#   back to its previous pin, once, and named in the PR. Then push the image,
#   pin it in src/craft-apps, bump the bundle's patch version, and open a PR.
#   Like version-bump.yml, that PR is opened with GITHUB_TOKEN, so the
#   repository's other workflows don't run on it until it is closed and
#   reopened (or a commit is pushed to it).
on:
  push:
    paths:
      - 'images/craft-apps/**'
      - '.github/workflows/craft-apps-image.yml'
  schedule:
    - cron: '23 6 * * 1'  # Mondays
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: craft-apps-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/craft-apps-web
  DIR: images/craft-apps

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Move the pins to the latest releases
        id: update
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node "$DIR/scripts/update.mjs" | tee "$RUNNER_TEMP/changes.md"
          if git diff --quiet -- "$DIR/apps.lock.json"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the smoke-test browser
        if: github.event_name == 'push' || steps.update.outputs.changed == 'true'
        working-directory: ${{ env.DIR }}
        run: |
          npm install --no-save --no-package-lock playwright@1.61.1
          npx playwright install --with-deps chromium

      - name: Build and smoke-test
        if: github.event_name == 'push' || steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          smoke() {
            node "$DIR/scripts/build.mjs"
            docker build -q -t craft-apps-web:ci "$DIR"
            docker rm -f craft-smoke >/dev/null 2>&1 || true
            docker run -d --name craft-smoke -p 8080:8080 craft-apps-web:ci
            for _ in $(seq 30); do curl -fs http://localhost:8080/healthz >/dev/null && break; sleep 1; done
            node "$DIR/scripts/smoke.mjs" http://localhost:8080 "$DIR/smoke"
          }
          if smoke; then exit 0; fi
          if [ "${{ github.event_name }}" = push ] || [ ! -s "$DIR/smoke/failures.txt" ]; then exit 1; fi
          # A new upstream release that doesn't start: keep the app on the pin it had.
          failed=$(paste -sd, "$DIR/smoke/failures.txt")
          node "$DIR/scripts/update.mjs" --revert "$failed" | tee -a "$RUNNER_TEMP/changes.md"
          smoke

      - name: Keep the screenshots
        if: always() && (github.event_name == 'push' || steps.update.outputs.changed == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: craft-apps-smoke
          path: ${{ env.DIR }}/smoke/
          if-no-files-found: ignore

      - name: Tag
        id: tag
        if: github.event_name == 'push' || steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # Content hash of the inputs (lock, lineup, landing page, nginx config, scripts).
          hash=$(cd "$DIR" && find . -type f -not -path './dist/*' -not -path './.cache/*' \
                   -not -path './node_modules/*' -not -path './smoke/*' -print0 \
                 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-12)
          echo "tag=$hash" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$IMAGE:$hash" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v4
        if: steps.tag.outputs.exists == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v4
        if: steps.tag.outputs.exists == 'false'

      # COPY-only Dockerfile, so both platforms build without emulation.
      - uses: docker/build-push-action@v7
        if: steps.tag.outputs.exists == 'false'
        with:
          context: ${{ env.DIR }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}

      - name: Report the image
        id: ref
        if: steps.tag.outputs.tag != ''
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE:${{ steps.tag.outputs.tag }}" --format '{{json .Manifest}}' | jq -r .digest)
          ref="$IMAGE:${{ steps.tag.outputs.tag }}@$digest"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "### craft-apps-web" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$ref\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Pin the image in the bundle
        id: bundle
        if: github.event_name != 'push' && steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet -- "$DIR/apps.lock.json"; then
            echo "Every new release failed the smoke test and was held back; nothing to propose."
            exit 0
          fi
          compose=src/craft-apps/src/compose.yaml
          sed -i -E "s#^(\s*image: )ghcr\.io/[^/]+/craft-apps-web:.*#\1${{ steps.ref.outputs.ref }}#" "$compose"
          git diff --quiet -- "$compose" && { echo "compose already pins this image"; exit 1; }
          version=$(cd src/craft-apps && npm version --no-git-tag-version patch | tr -d v)
          jq --arg v "$version" '.version = $v' src/craft-apps/src/manifest.json > manifest.tmp && mv manifest.tmp src/craft-apps/src/manifest.json
          node bin/validate-manifest.mjs src/craft-apps/src/manifest.json
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo
            echo "Image: \`${{ steps.ref.outputs.ref }}\` (every app passed the headless smoke test; screenshots are in the run's \`craft-apps-smoke\` artifact)."
            echo
            echo "Opened by the weekly Craft Apps job with GITHUB_TOKEN, so the other workflows haven't run on it: close and reopen the PR to run them."
          } >> "$RUNNER_TEMP/changes.md"

      - uses: peter-evans/create-pull-request@v8
        if: steps.bundle.outputs.version != ''
        with:
          commit-message: "chore(craft-apps): latest upstream web builds, bundle ${{ steps.bundle.outputs.version }}"
          title: "chore(craft-apps): latest upstream web builds, bundle ${{ steps.bundle.outputs.version }}"
          body-path: ${{ runner.temp }}/changes.md
          add-paths: |
            images/craft-apps/apps.lock.json
            src/craft-apps/
          branch: craft-apps/weekly
          base: main
          labels: automated-pr
