name: Build and Publish Changed Packages

# Apps live under src/<name>/ and are published to GHCR as LOOSE OCI FILE LAYERS
# (bin/push-oci-package.sh): each top-level file under src/<name>/src/
# (compose.yaml, manifest.json, …) becomes its own layer, so the Hola server's
# `oras pull -o <dir>` gets the files directly. On merge to main we also
# regenerate the root catalog.json index the server consumes via HOLA_CATALOG_URL.
#
# Two publish paths, decided by the package's own version (docs/release-channels.md):
# a release version publishes on merge to main and moves `:latest`; a pre-release
# version (0.11.0-rc.1) publishes straight from its pull request, moves nothing,
# and reaches the catalog as a `versions[]` entry with a `channel` marker on the
# next regeneration from main.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'bin/**'
      - 'schemas/**'
      - 'catalog.json'
      - '.github/workflows/build-and-publish.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'bin/**'
      - 'schemas/**'
      - 'catalog.json'
      - '.github/workflows/build-and-publish.yml'
  workflow_dispatch:
    inputs:
      package:
        description: 'Specific package to build (leave empty for auto-detection)'
        required: false
        type: string

jobs:
  # Detect which src/<name> packages changed in this push/PR.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed_packages: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: filter
        run: |
          # Manual trigger with an explicit package name.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.package }}" != "" ]]; then
            CHANGED="[\"${{ github.event.inputs.package }}\"]"
            echo "changes=${CHANGED}" >> $GITHUB_OUTPUT
            echo "Manually selected package: ${CHANGED}"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA=${{ github.event.pull_request.base.sha }}
            HEAD_SHA=${{ github.event.pull_request.head.sha }}
          else
            BASE_SHA=${{ github.event.before }}
            HEAD_SHA=${{ github.sha }}
          fi

          # Unique src/<name> dirs with changes, as a JSON array — but only for
          # files that actually reach the registry. The published artifact is the
          # loose layers from src/<name>/src/ plus the version and annotations
          # read from src/<name>/package.json; a README edit changes neither, so
          # counting it republished a byte-identical bundle under a new digest.
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep -E '^src/[^/]+/(src/.+|package\.json)$' \
            | cut -d/ -f2 | sort -u | jq -R . | jq -s -c .)
          echo "changes=${CHANGED}" >> $GITHUB_OUTPUT
          echo "Changed packages: ${CHANGED}"

  # Publish changed packages as loose OCI layers.
  #
  # Release versions publish on merge to main, as they always have. A
  # PRE-RELEASE version (semver: the version contains a `-`, e.g. 0.11.0-rc.1)
  # also publishes FROM THE PULL REQUEST that introduces it — otherwise getting
  # an rc bundle into the world would mean merging it to main first, which is
  # the production catalog change the rc exists to avoid (try-hola/apps#149).
  # The trigger is mechanical, decided from the package's own version rather
  # than a label or an input: on a PR, publish exactly the changed packages
  # whose version is a pre-release and nothing else.
  #
  # A PR publish can never move a moving tag: it passes moving-tag `none`, and
  # push-oci-package.sh refuses to move `:latest` for a pre-release anyway.
  # Fork PRs are skipped — GITHUB_TOKEN is read-only there, so the push would
  # fail rather than be denied.
  build-and-publish:
    needs: detect-changes
    if: >-
      ${{ needs.detect-changes.outputs.changed_packages != '[]'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.changed_packages) }}
    steps:
      # Full history: push-oci-package.sh pins the artifact's `created`
      # annotation to the commit that last touched the package's bundle files,
      # which a depth-1 clone can't resolve.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ORAS
        uses: oras-project/setup-oras@v2

      # The matrix is built from the diff, which includes deletions — skip a
      # package that was removed in this push.
      - name: Publish loose-layer package
        env:
          PACKAGE: ${{ matrix.package }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          REGISTRY_PATH: ghcr.io/${{ github.repository_owner }}
          REPOSITORY: ${{ github.event.repository.name }}
        run: |
          if [ ! -d "src/$PACKAGE/src" ]; then
            echo "src/$PACKAGE no longer present (deleted) — skipping publish"
            exit 0
          fi

          VERSION=$(jq -r .version "src/$PACKAGE/package.json")

          # Pre-releases are the only thing a PR may publish, and it publishes
          # them without touching a moving tag.
          MOVING_TAG=latest
          if [ "$IS_PULL_REQUEST" = "true" ]; then
            case "$VERSION" in
              *-*) MOVING_TAG=none ;;
              *)
                echo "::notice title=Not published::$PACKAGE $VERSION is a release version — it publishes on merge to main, not from a pull request."
                exit 0
                ;;
            esac
          fi

          ./bin/push-oci-package.sh "$PACKAGE" "$REGISTRY_PATH" "$REPOSITORY" "$MOVING_TAG"

          if [ "$IS_PULL_REQUEST" = "true" ]; then
            echo "::notice title=Pre-release published::$REGISTRY_PATH/$PACKAGE:$VERSION is published. It joins catalog.json (with its channel marker) on the next regeneration from main; see docs/release-channels.md."
          fi

  # Regenerate + commit catalog.json on merge to main so the hosted index
  # (raw.githubusercontent.com/<owner>/<repo>/main/catalog.json) stays in sync.
  #
  # Stable entries come from each package.json; PRE-RELEASE entries come from the
  # app's GHCR tags, which is where a PR-published rc lives (it is never merged
  # into main's package.json). That is why this job needs a registry login and
  # ORAS, and why it runs with CATALOG_PRERELEASES=require: a registry hiccup
  # must fail the workflow, not quietly publish a catalog with every pre-release
  # retired. `workflow_dispatch` on main is the button for pulling a freshly
  # PR-published rc into the index without waiting for the next merge.
  build-catalog:
    needs: build-and-publish
    # Run on any push to main, even when no package qualified for publish.
    if: >-
      ${{ always()
          && (github.event_name == 'push'
              || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7

      # `oras repo tags` reads the credentials docker/login-action writes to
      # ~/.docker/config.json (public packages list anonymously, but a package
      # left private after publish would otherwise fail the job).
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ORAS
        uses: oras-project/setup-oras@v2

      - name: Generate catalog.json
        env:
          CATALOG_PRERELEASES: require
        run: ./bin/build-catalog.sh "${{ github.repository_owner }}"

      # The generator asserts the channel grammar as it emits; this re-checks the
      # finished file against schemas/catalog.schema.json before it is committed,
      # so a malformed marker can't reach the hosted index by way of a bot commit
      # that no pull request reviewed.
      - name: Validate catalog.json
        run: node bin/validate-catalog.mjs

      - name: Commit catalog.json if changed
        run: |
          if git diff --quiet -- catalog.json; then
            echo "catalog.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "chore(catalog): regenerate catalog.json [skip ci]"
          git push

  # Validate EVERY manifest, not just the changed packages.
  #
  # `verify-packages` below runs per changed package, which leaves the shared
  # inputs unguarded: schemas/manifest.schema.json and bin/validate-manifest.mjs
  # apply to all 17 apps, and a change to either can break apps its diff never
  # touches. Worse, a schema-only PR changes no package at all, so the matrix is
  # empty, `verify-packages` is skipped, and nothing is validated — a schema edit
  # could reject every manifest in the catalog and still show green.
  #
  # Cheap enough to run on every PR that reaches this workflow (17 manifests),
  # and it is the only job that can fail on a schema/validator regression.
  validate-catalog:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # No arguments: validate-manifest.mjs discovers every src/*/src/manifest.json.
      - name: Validate every manifest against the schema
        run: node bin/validate-manifest.mjs

      # The committed index, against schemas/catalog.schema.json: shape, plus the
      # release-channel rules the server resolves silently (a channel outside
      # ^[a-z][a-z0-9-]{0,31}$ is DROPPED rather than defaulted to stable, a
      # repeated version keeps only its first entry). Failing here beats being
      # dropped by every server.
      - name: Validate catalog.json
        run: node bin/validate-catalog.mjs

  # Verify package structure on PRs (loose-layer contract).
  verify-packages:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.changed_packages != '[]' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.changed_packages) }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate package layout
        run: |
          PKG="src/${{ matrix.package }}"
          # A package may be deleted in a PR (e.g. retiring one) — that's valid.
          if [ ! -d "$PKG" ]; then
            echo "$PKG not present (deleted) — nothing to validate"
            exit 0
          fi

          [ -f "$PKG/package.json" ] || { echo "Error: $PKG/package.json not found"; exit 1; }
          VERSION=$(jq -r .version "$PKG/package.json")
          NAME=$(jq -r .name "$PKG/package.json")
          [ "$VERSION" != "null" ] && [ -n "$VERSION" ] || { echo "Error: missing version in package.json"; exit 1; }
          [ "$NAME" != "null" ] && [ -n "$NAME" ] || { echo "Error: missing name in package.json"; exit 1; }

          # Loose-layer format: the Hola server requires compose.yaml + manifest.json.
          [ -f "$PKG/src/compose.yaml" ] || { echo "Error: $PKG/src/compose.yaml not found (Hola requires compose.yaml)"; exit 1; }
          [ -f "$PKG/src/manifest.json" ] || { echo "Error: $PKG/src/manifest.json not found (Hola requires manifest.json)"; exit 1; }

          # The Hola server attaches `ingress.service` to the Traefik network and
          # injects auth env into it. For a multi-service app whose web service is
          # not named after the app id (or not listed first), an omitted or wrong
          # ingress.service silently mis-routes the app, so require it to name a
          # real service in compose.yaml.
          SERVICE=$(jq -r '.ingress.service // empty' "$PKG/src/manifest.json")
          [ -n "$SERVICE" ] || { echo "Error: $PKG/src/manifest.json must declare ingress.service (the compose service Traefik routes to)"; exit 1; }
          grep -qE "^  ${SERVICE}:" "$PKG/src/compose.yaml" \
            || { echo "Error: ingress.service '$SERVICE' is not a service in $PKG/src/compose.yaml"; exit 1; }

          echo "Package ${{ matrix.package }} validated (version: $VERSION, ingress.service: $SERVICE)"

      - name: Set up Node.js
        if: ${{ hashFiles(format('src/{0}/src/manifest.json', matrix.package)) != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Full manifest.json schema check (typed defaultEnv shape, auth/upgrade/backup/
      # push blocks, etc.) plus semantic checks (enum defaults, min<=max, generate
      # requires isSecret, ingress.service / backup hooks / push postHooks vs
      # compose.yaml, unique + containment-safe push paths) that the jq/grep checks
      # above don't cover. See schemas/manifest.schema.json and bin/validate-manifest.mjs.
      - name: Validate manifest.json schema
        if: ${{ hashFiles(format('src/{0}/src/manifest.json', matrix.package)) != '' }}
        run: node bin/validate-manifest.mjs "src/${{ matrix.package }}/src/manifest.json"
