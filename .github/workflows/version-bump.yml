name: Automatic Version Bump

# Manually triggered from the GitHub Actions UI: bump one app's bundle version
# and open the PR that carries it.
#
# Apps live under src/<name>/ (there is no packages/ directory), and the bundle
# version is written in TWO places that must agree — src/<name>/package.json
# (what CI publishes and what catalog.json lists) and src/<name>/src/manifest.json
# (`version`, required by schemas/manifest.schema.json). This workflow moves both.
#
# Pre-release bumps (prerelease / prepatch / preminor / premajor, identifier
# `rc` by default) are how a release-channel bundle starts: merging the PR is
# NOT the publish step — build-and-publish.yml publishes a pre-release version
# from the pull request itself, and it reaches catalog.json on the `rc` channel
# via the app's GHCR tags. Leave that PR open until the rc graduates, then bump
# it to the release version and merge. See docs/release-channels.md.
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'App to bump (the directory name under src/)'
        required: true
        type: string
      bump:
        description: 'Version bump type (npm semver semantics)'
        required: true
        type: choice
        options:
          - patch        # 1.2.3 → 1.2.4
          - minor        # 1.2.3 → 1.3.0
          - major        # 1.2.3 → 2.0.0
          - prerelease   # next pre-release of the current version (1.3.0-rc.0 → 1.3.0-rc.1)
          - prepatch     # start a pre-release of the next patch  (1.2.3 → 1.2.4-rc.0)
          - preminor     # start a pre-release of the next minor  (1.2.3 → 1.3.0-rc.0)
          - premajor     # start a pre-release of the next major  (1.2.3 → 2.0.0-rc.0)
        default: 'patch'
      identifier:
        description: 'Pre-release identifier — becomes the release channel (rc, beta, alpha). Ignored for patch/minor/major.'
        required: false
        type: string
        default: 'rc'

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for PR creation

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Bump version
        id: bump
        env:
          PACKAGE: ${{ inputs.package }}
          BUMP: ${{ inputs.bump }}
          IDENTIFIER: ${{ inputs.identifier }}
        run: |
          set -euo pipefail
          PKG_DIR="src/$PACKAGE"
          PKG_JSON="$PKG_DIR/package.json"
          MANIFEST="$PKG_DIR/src/manifest.json"

          [ -f "$PKG_JSON" ] || { echo "Error: $PKG_JSON not found (apps live under src/<name>/)"; exit 1; }
          [ -f "$MANIFEST" ] || { echo "Error: $MANIFEST not found"; exit 1; }

          # The pre-release identifier becomes the catalog channel name, which the
          # Hola server DROPS rather than defaults when it is malformed — so it has
          # to satisfy the channel grammar before it reaches a version string.
          case "$BUMP" in
            pre*)
              [[ "$IDENTIFIER" =~ ^[a-z][a-z0-9-]{0,31}$ ]] \
                || { echo "Error: identifier '$IDENTIFIER' is not a valid channel name (^[a-z][a-z0-9-]{0,31}\$)"; exit 1; }
              ;;
          esac

          CURRENT_VERSION=$(jq -r .version "$PKG_JSON")

          # npm owns the semver arithmetic (including pre-release identifiers), so
          # this workflow never hand-rolls it. --no-git-tag-version: the PR is the
          # artifact, not a tag.
          NEW_VERSION=$(cd "$PKG_DIR" && npm version --no-git-tag-version --preid "$IDENTIFIER" "$BUMP" | tr -d 'v')

          # manifest.json carries the same version and is validated against it.
          jq --arg v "$NEW_VERSION" '.version = $v' "$MANIFEST" > "$MANIFEST.tmp" && mv "$MANIFEST.tmp" "$MANIFEST"

          {
            echo "new_version=$NEW_VERSION"
            echo "current_version=$CURRENT_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Bumped $PACKAGE from $CURRENT_VERSION to $NEW_VERSION (package.json + manifest.json)"

      - name: Validate the bumped manifest
        run: node bin/validate-manifest.mjs "src/${{ inputs.package }}/src/manifest.json"

      - name: Create version bump PR
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: bump ${{ inputs.package }} version to ${{ steps.bump.outputs.new_version }}"
          title: "Version Bump: ${{ inputs.package }} to ${{ steps.bump.outputs.new_version }}"
          body: |
            Automated version bump for `${{ inputs.package }}`.

            - Bump type: `${{ inputs.bump }}`
            - Version: `${{ steps.bump.outputs.current_version }}` → `${{ steps.bump.outputs.new_version }}`

            Bundle version only — the upstream image pin in `src/${{ inputs.package }}/src/compose.yaml`
            and the manifest's `upgrade` / `backup` metadata still need a human.

            A **pre-release** version publishes
            `ghcr.io/${{ github.repository_owner }}/${{ inputs.package }}:${{ steps.bump.outputs.new_version }}`
            from this pull request without moving `:latest`, and appears in `catalog.json`
            on its own channel. See `docs/release-channels.md`.
          branch: "version-bump/${{ inputs.package }}"
          base: main
          labels: version-bump, automated-pr
