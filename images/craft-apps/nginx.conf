# Craft Apps: static files only. Replaces the image's /etc/nginx/conf.d/default.conf
# (included inside nginx-unprivileged's http block, which already maps .wasm to
# application/wasm and points every temp path at /tmp).

# Files whose names carry a content hash never change; everything else (index.html,
# the loaders, parts.txt, sw.js, unhashed .wasm) revalidates. This follows the
# caching each app's HOSTING.md asks for.
map $uri $craft_cache {
    "~-[0-9a-f]{16}(_bg)?\.(wasm|js)$"  "public, max-age=31536000, immutable";
    "~\.part-[a-z]+$"                   "public, max-age=31536000, immutable";
    "~^/_craft/fonts/"                  "public, max-age=604800";
    default                             "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Behind Traefik: a directory redirect (/gridcraft → /gridcraft/) must stay relative,
    # or nginx would send the browser to http://<container>:8080/.
    absolute_redirect off;

    # A `types` block here replaces the http-level map, so the stock one comes first.
    include /etc/nginx/mime.types;
    types {
        text/javascript              mjs;
        application/manifest+json    webmanifest;
    }

    # build.mjs wrote a .gz beside every text asset.
    gzip_static on;
    gunzip on;

    add_header Cache-Control $craft_cache always;
    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Each .wasm exists only as .wasm.gz; send that, inflating it for the rare client
    # that doesn't accept gzip. The part files are gzip already and are sent as they are.
    location ~ \.wasm$ {
        gzip_static always;
    }
}
